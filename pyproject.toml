[project]
name = "erlenmeyer"
version = "0.3.0"
description = "Build chemical reaction networks and simulate them with ODE or Gillespie solvers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Simone Sturniolo", email = "simonesturniolo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
examples = [
    "marimo>=0.24.0",
    "matplotlib>=3.11.1",
]
